[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pysynthdata"
version = "0.5.0"
description = "Generate synthetic relational datasets from a schema: real row generation, foreign keys, constraints, and quality scoring."
readme = "README.md"
license = {text = "Proprietary"}
authors = [{name = "Georgi Mullassery", email = "mullassery@gmail.com"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
]
db = [
    "sqlalchemy>=2.0",
]

[project.scripts]
pysynthdata = "pysynthdata.cli:main"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "pysynthdata._core"
features = ["pyo3/extension-module"]
include = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W"]

[tool.mypy]
python_version = "3.10"
strict = true

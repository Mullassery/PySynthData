[package]
name = "pysynthdata"
version = "0.2.0"
edition = "2021"
description = "Generate complete synthetic worlds from schemas, data, or natural language. Production-ready with compliance, governance, and enterprise features."
repository = "https://github.com/Mullassery/PySynthData"
license = "Apache-2.0"
publish = true
authors = ["Georgi Mullassery <mullassery@gmail.com>"]
keywords = ["synthetic-data", "simulation", "robotics", "compliance", "enterprise"]

[dependencies]
pyo3 = { version = "0.21", features = ["abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.7"
thiserror = "1.0"
anyhow = "1.0"
hashbrown = "0.14"
indexmap = { version = "2.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
approx = "0.5"

[[bin]]
name = "pysynthdata_cli"
path = "src/bin/cli.rs"

[lib]
name = "pysynthdata"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
